<html>
    <head>
        <style>
            body{
                display:flex;
                justify-content: center;
                align-items: center;                
            }
            .box{
                height: 300px;
                width: 300px;
                border: 2px solid black;
                background-color: yellow;
                transition-duration: 2s;
                transition-delay: 1s;
            }
            .box:hover{
                background-color: bisque;
                border-radius: 50%;
                transform: rotate(360deg);
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
        
    </body>
</html>
